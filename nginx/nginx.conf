events {
    worker_connections 2048;
}

http {
    upstream web_app {
        server web:3000;
    }

    upstream admin_app {
        server admin:3001;
    }

    upstream volunteer_app {
        server volunteer:3002;
    }

    upstream wallet_service {
        server wallet-service:4000;
    }

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name localhost carnival.edu;

        # Web App (Participants)
        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin Dashboard
        location /admin {
            proxy_pass http://admin_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Volunteer Scanner
        location /scanner {
            proxy_pass http://volunteer_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Routes with strict Rate Limiting
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://wallet_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
