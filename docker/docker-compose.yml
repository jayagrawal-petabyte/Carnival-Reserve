version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: carnival_postgres
    environment:
      POSTGRES_DB: carnival_reserve
      POSTGRES_USER: carnival_admin
      POSTGRES_PASSWORD: carnival_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: carnival_redis
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    container_name: carnival_nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
